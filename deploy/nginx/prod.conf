# Gateway de produção atrás do Cloudflare (proxy laranja, SSL/TLS em "Full (strict)").
# O certificado é o Cloudflare Origin Certificate de ambrosiaai.site, gravado pelo pipeline em
# deploy/nginx/certs/ (fora do git).
map $http_x_forwarded_proto $forwarded_proto {
    default https;
}

server {
    listen 80;
    server_name ambrosiaai.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ambrosiaai.site;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # IP real do visitante (o Cloudflare envia em CF-Connecting-IP).
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/ambrosio/cloudflare-ips.inc;

    include /etc/nginx/ambrosio/routes.inc;
}

# Qualquer outro Host (acesso direto pelo IP, por exemplo) é recusado.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 444;
}
