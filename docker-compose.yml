# Homologação local: frontend + API atrás de um gateway nginx, no Docker do WSL2. O banco é externo
# (não sobe container de banco aqui): a API recebe a connection string pronta em
# AMBROSIO_CONNECTION_STRING.
#   wsl --cd /mnt/c/repos/ambrosia -e docker compose up -d --build
#   http://localhost:8080/api/swagger
# Variáveis em .env (copiar de .env.example). O frontend entra com --profile frontend (HU 002).
name: ambrosio-homolog

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Homolog
  ConnectionStrings__AmbrosioContext: ${AMBROSIO_CONNECTION_STRING}
  Auth__JwtSecret: ${AMBROSIO_JWT_SECRET}
  Auth__GoogleClientId: ${AMBROSIO_GOOGLE_CLIENT_ID:-}
  CpfProtection__Pepper: ${AMBROSIO_CPF_PEPPER}
  CpfProtection__EncryptionKey: ${AMBROSIO_CPF_ENCRYPTION_KEY}
  # Storage de imagens (feature 004): o endpoint fica no appsettings.Homolog.json e o bucket é fixo;
  # só o par de chaves é segredo e vem do .env. Os prazos curtos de homolog (1/1/2/1 min) vêm do .env
  # com padrão sobrescrevível — são eles que fazem os testes de expiração e de limpeza rodarem em minutos.
  ObjectStorage__AccessKey: ${S3_ACCESS_KEY}
  ObjectStorage__SecretKey: ${S3_SECRET_KEY}
  ObjectStorage__Bucket: emagine
  ObjectStorage__PresignedReadMinutes: ${STORAGE_PRESIGNED_READ_MINUTES:-1}
  ObjectStorage__PresignedUploadMinutes: ${STORAGE_PRESIGNED_UPLOAD_MINUTES:-1}
  ObjectStorage__PendingTtlMinutes: ${STORAGE_PENDING_TTL_MINUTES:-2}
  ObjectStorage__CleanupIntervalMinutes: ${STORAGE_CLEANUP_INTERVAL_MINUTES:-1}
  # Importação do +Vendas (feature 006, research §3/§13): homolog importa de verdade com o coletor
  # Playwright (Chromium na imagem). Fixo, sem configuração.
  MaisVendas__Collector: Playwright
  # Cifra das credenciais do +Vendas (feature 008, research R2; constituição §VI emenda 3.4.1): chave
  # dedicada, base64 de 32 bytes (openssl rand -base64 32), só no .env. API e host do MCP recusam o
  # startup sem ela, e trocá-la invalida as credenciais já gravadas (a vendedora cadastra de novo).
  MaisVendas__CredentialsKey: ${AMBROSIO_MAIS_VENDAS_CREDENTIALS_KEY}

services:
  migrator:
    build:
      context: ./backend
      target: migrator
    image: ambrosio-migrator:homolog
    container_name: ambrosio-homolog-migrator
    restart: "no"
    environment: *api-environment
    networks:
      - ambrosio-homolog

  api:
    build:
      context: ./backend
      target: final
    image: ambrosio-api:homolog
    container_name: ambrosio-homolog-api
    restart: unless-stopped
    environment: *api-environment
    # Chromium do coletor Playwright (feature 006, research §2): /dev/shm padrão de 64 MB faz o
    # navegador abortar em navegação. Mesmo valor de produção.
    shm_size: 512m
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosio-homolog

  # Plugin do ChatGPT (feature 007, R8): um único host para o servidor MCP (`/mcp`) e o
  # authorization server OAuth 2.1 (`/auth`). Herda o `x-api-environment` porque reaproveita banco,
  # proteção de CPF e storage da API; o que é só dele são os endereços canônicos e a chave RSA.
  # Sem `shm_size`: o target `mcp` da imagem não carrega o Chromium porque este host não executa
  # coleta nenhuma. Desde a feature 008 ele também INICIA importações (`iniciar_importacao`,
  # `atualizar_base`), mas o que faz é gravar a execução como `queued` no banco — quem coleta é o
  # worker da API, único processo com navegador, que reivindica as execuções na fila do banco.
  # É o mesmo sentido do cancelamento, que já viaja pelo banco (R9 da 008).
  mcp:
    build:
      context: ./backend
      target: mcp
    image: ambrosio-mcp:homolog
    container_name: ambrosio-homolog-mcp
    restart: unless-stopped
    environment:
      <<: *api-environment
      # Endereços canônicos da homologação, fixos (o fluxo do ChatGPT só é testado em produção).
      Auth__Issuer: http://localhost:8080/auth
      Mcp__ResourceUrl: http://localhost:8080/mcp
      # Chave RSA em PEM (PKCS#8). Em homolog pode ficar vazia: o host gera uma em
      # %APPDATA%/Ambrosio apenas em Development, e aqui a suíte de testes de API é quem precisa de
      # uma chave estável entre restarts — por isso ela é variável e não segredo de produção.
      Auth__SigningKeyPem: ${AMBROSIO_AUTH_SIGNING_KEY_PEM:-}
      # Terceiro item da lista do appsettings (0 e 1 são as URIs do ChatGPT): a URI de callback que a
      # suíte de testes de API registra por DCR (ApiTestFixture Auth:TestRedirectUri).
      Auth__AllowedRedirectUris__2: ${MCP_TEST_REDIRECT_URI:-https://chatgpt.com/connector/oauth/apitest}
      # Origens de navegador aceitas no /mcp (R17). Em homolog é o próprio gateway.
      Mcp__AllowedOrigins__0: http://localhost:8080
      Mcp__FrontendBaseUrl: http://localhost:8080
    volumes:
      - mcp_dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosio-homolog

  # HU 002: ativar com --profile frontend quando frontend/Dockerfile existir.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      # Flags de BUILD (o Vite embute no bundle). Desde a 003 a entrada de
      # desenvolvimento nao existe em ambiente nenhum (FR-012/FR-013), entao
      # homolog e production constroem exatamente igual.
      args:
        BUILD_MODE: homolog
        VITE_GOOGLE_CLIENT_ID: ${AMBROSIO_GOOGLE_CLIENT_ID:-}
    image: ambrosio-frontend:homolog
    container_name: ambrosio-homolog-frontend
    restart: unless-stopped
    # CSP do container (feature 004, T054): a origem publica do bucket entra por
    # variavel de RUNTIME -- o nginx faz envsubst do template no startup -- entao
    # nenhuma origem de storage fica fixa na imagem (FR-023).
    environment:
      STORAGE_ORIGIN: https://emagine.nyc3.digitaloceanspaces.com
    networks:
      - ambrosio-homolog

  gateway:
    image: nginx:1.27-alpine
    container_name: ambrosio-homolog-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/homolog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/routes.inc:/etc/nginx/ambrosio/routes.inc:ro
    depends_on:
      - api
    networks:
      - ambrosio-homolog

volumes:
  dataprotection_keys:
  # Chaves do Data Protection do host do MCP, separadas das da API: os dois processos têm propósitos
  # diferentes (cookies de sessão do AS + tokens do OpenIddict vs. JWT das telas).
  mcp_dataprotection_keys:

networks:
  ambrosio-homolog:
    driver: bridge
