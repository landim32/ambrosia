# Homologação local: frontend + API + PostgreSQL atrás de um gateway nginx, no Docker do WSL2.
#   wsl --cd /mnt/c/repos/ambrosia -e docker compose up -d --build
#   http://localhost:8080/api/swagger
# Variáveis em .env (copiar de .env.example). O frontend entra com --profile frontend (HU 002).
name: ambrosia-homolog

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Homolog
  ConnectionStrings__AmbrosiaContext: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  Auth__JwtSecret: ${AUTH_JWT_SECRET}
  Auth__GoogleClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
  CpfProtection__Pepper: ${CPF_PEPPER}
  CpfProtection__EncryptionKey: ${CPF_ENCRYPTION_KEY}
  # Storage de imagens (feature 004): endpoint/bucket ficam no appsettings.Homolog.json; só o
  # segredo entra aqui, e os prazos curtos de homolog (1/1/2/1 min) vêm do .env com padrão
  # sobrescrevível — são eles que fazem os testes de expiração e de limpeza rodarem em minutos.
  ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY}
  ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY}
  ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:-ambrosio}
  ObjectStorage__PresignedReadMinutes: ${STORAGE_PRESIGNED_READ_MINUTES:-1}
  ObjectStorage__PresignedUploadMinutes: ${STORAGE_PRESIGNED_UPLOAD_MINUTES:-1}
  ObjectStorage__PendingTtlMinutes: ${STORAGE_PENDING_TTL_MINUTES:-2}
  ObjectStorage__CleanupIntervalMinutes: ${STORAGE_CLEANUP_INTERVAL_MINUTES:-1}

services:
  db:
    image: postgres:17-alpine
    container_name: ambrosia-homolog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ambrosia-homolog

  migrator:
    build:
      context: ./backend
      target: migrator
    image: ambrosia-migrator:homolog
    container_name: ambrosia-homolog-migrator
    restart: "no"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ambrosia-homolog

  api:
    build:
      context: ./backend
      target: final
    image: ambrosia-api:homolog
    container_name: ambrosia-homolog-api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosia-homolog

  # HU 002: ativar com --profile frontend quando frontend/Dockerfile existir.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      # Flags de BUILD (o Vite embute no bundle). Desde a 003 a entrada de
      # desenvolvimento nao existe em ambiente nenhum (FR-012/FR-013), entao
      # homolog e production constroem exatamente igual.
      args:
        BUILD_MODE: homolog
        VITE_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
    image: ambrosia-frontend:homolog
    container_name: ambrosia-homolog-frontend
    restart: unless-stopped
    networks:
      - ambrosia-homolog

  gateway:
    image: nginx:1.27-alpine
    container_name: ambrosia-homolog-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/homolog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/routes.inc:/etc/nginx/ambrosia/routes.inc:ro
    depends_on:
      - api
    networks:
      - ambrosia-homolog

volumes:
  postgres_data:
  dataprotection_keys:

networks:
  ambrosia-homolog:
    driver: bridge
