# Produção (https://ambrosioai.site), executado pelo pipeline .github/workflows/deploy-prod.yml.
# Mesmo layout dos outros apps da Emagine (Roll6, AvaBot): Cloudflare na frente e o nginx compartilhado
# do servidor (repositório emagine-deploy, container emagine-app1) termina o HTTPS, serve o SPA já
# compilado (builds/ambrosia) e faz proxy de /api para ambrosia-api:8080 e de /auth, /mcp e
# /.well-known/oauth-* para ambrosia-mcp:8080 pela rede externa compartilhada "emagine-network".
# Nenhuma porta é publicada aqui, e não sobe frontend nem gateway.
# Banco: DigitalOcean Managed PostgreSQL (não sobe container de banco aqui).
#   docker compose --env-file .env.prod -f docker-compose-prod.yml up -d --build
# Os nomes de projeto, containers, imagens e redes continuam "ambrosia" de propósito: são os que já
# rodam no servidor, e o nginx do emagine-deploy chega aos serviços pelo container_name.
name: ambrosia

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__AmbrosioContext: ${AMBROSIO_CONNECTION_STRING}
  Auth__JwtSecret: ${AMBROSIO_JWT_SECRET}
  Auth__GoogleClientId: ${AMBROSIO_GOOGLE_CLIENT_ID}
  CpfProtection__Pepper: ${AMBROSIO_CPF_PEPPER}
  CpfProtection__EncryptionKey: ${AMBROSIO_CPF_ENCRYPTION_KEY}
  # Storage de imagens (feature 004, T054): só o par de chaves e segredo e vem do .env.prod;
  # o bucket e fixo aqui, e endpoint, regiao e ForcePathStyle ficam no appsettings.Production.json
  # (skill dotnet-env). Os prazos ficam os de producao (15/5/60/15) do appsettings base.
  ObjectStorage__AccessKey: ${S3_ACCESS_KEY}
  ObjectStorage__SecretKey: ${S3_SECRET_KEY}
  ObjectStorage__Bucket: ambrosia-prod
  # Importação do +Vendas (feature 006): produção usa o coletor Playwright real, fixo. O startup
  # recusa Collector=Fake em Production (research §3).
  MaisVendas__Collector: Playwright

services:
  migrator:
    build:
      context: ./backend
      target: migrator
    image: ambrosia-migrator:prod
    container_name: ambrosia-migrator
    restart: "no"
    environment: *api-environment
    networks:
      - ambrosia-network

  api:
    build:
      context: ./backend
      target: final
    image: ambrosia-api:prod
    container_name: ambrosia-api
    restart: unless-stopped
    environment: *api-environment
    # Chromium do coletor do +Vendas (feature 006, research §2): /dev/shm de 64 MB (padrão) faz o
    # navegador abortar no meio da coleta. O teto de memória cobre a API e um Chromium por execução
    # (MaxConcurrentRuns = 2) — deploy/README.md.
    shm_size: 512m
    mem_limit: 1536m
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosia-network
      # Rede compartilhada: o nginx do emagine-deploy chega em ambrosia-api:8080 (/api).
      - emagine-network

  # Plugin do ChatGPT (feature 007, R8): authorization server OAuth 2.1 em /auth + servidor MCP em
  # /mcp, no mesmo host. Mesmos segredos compartilhados da API (banco, CPF, storage) porque o host
  # reaproveita o domínio; os endereços canônicos e a chave RSA de assinatura são só dele.
  # Nomes no padrão `ambrosia-*` do resto do arquivo — ver o cabeçalho: o nginx do emagine-deploy
  # depende do container_name.
  mcp:
    build:
      context: ./backend
      target: mcp
    image: ambrosia-mcp:prod
    container_name: ambrosia-mcp
    restart: unless-stopped
    environment:
      <<: *api-environment
      # Endereços canônicos e imutáveis do serviço (spec 007, "Endereços definitivos"), fixos.
      Auth__Issuer: https://ambrosioai.site/auth
      Mcp__ResourceUrl: https://ambrosioai.site/mcp
      # Segredo de verdade: RSA 2048 em PEM (PKCS#8), gravado pelo pipeline a partir do GitHub
      # Secret de mesmo nome. Sem ela o host recusa o startup (constituição §VI, emenda 3.4.0).
      Auth__SigningKeyPem: ${AMBROSIO_AUTH_SIGNING_KEY_PEM}
      # Em produção só as URIs do ChatGPT, do appsettings.Production.json: a URI de teste da suíte de
      # API não existe aqui (não entra por env).
      Mcp__AllowedOrigins__0: https://ambrosioai.site
      Mcp__FrontendBaseUrl: https://ambrosioai.site
    mem_limit: 512m
    volumes:
      - mcp_dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosia-network
      # Rede compartilhada: o nginx do emagine-deploy chega em ambrosia-mcp:8080 (/auth, /mcp,
      # /.well-known/oauth-*).
      - emagine-network

volumes:
  dataprotection_keys:
  # Chaves do Data Protection do host do MCP, separadas das da API (cookies de sessão do AS e
  # tokens do OpenIddict). Preservadas entre recriações: perdê-las derruba as conexões do ChatGPT.
  mcp_dataprotection_keys:

networks:
  ambrosia-network:
    driver: bridge
  # Criada pelo deploy do emagine-deploy (e pelo deste pipeline, se ainda não existir).
  emagine-network:
    external: true
