# Produção (https://ambrosiaai.site), executado pelo pipeline .github/workflows/deploy-prod.yml.
# Cloudflare na frente (SSL "Full (strict)") -> gateway nginx com Origin Certificate -> serviços.
# Banco: DigitalOcean Managed PostgreSQL (não sobe container de banco aqui).
#   docker compose --env-file .env.prod -f docker-compose-prod.yml up -d --build
name: ambrosia

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__AmbrosiaContext: ${DB_CONNECTION_STRING}
  Auth__JwtSecret: ${AUTH_JWT_SECRET}
  Auth__GoogleClientId: ${AUTH_GOOGLE_CLIENT_ID}
  CpfProtection__Pepper: ${CPF_PEPPER}
  CpfProtection__EncryptionKey: ${CPF_ENCRYPTION_KEY}

services:
  migrator:
    build:
      context: ./backend
      target: migrator
    image: ambrosia-migrator:prod
    container_name: ambrosia-migrator
    restart: "no"
    environment: *api-environment
    networks:
      - ambrosia-network

  api:
    build:
      context: ./backend
      target: final
    image: ambrosia-api:prod
    container_name: ambrosia-api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - ambrosia-network

  # HU 002: o pipeline ativa o profile quando frontend/Dockerfile existir.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      # SEM VITE_DEV_LOGIN: a entrada de desenvolvimento nao entra no bundle
      # de producao (FR-002 / SC-008, provado por npm run verify:prod).
      args:
        BUILD_MODE: production
        VITE_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
    image: ambrosia-frontend:prod
    container_name: ambrosia-frontend
    restart: unless-stopped
    networks:
      - ambrosia-network

  gateway:
    image: nginx:1.27-alpine
    container_name: ambrosia-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/routes.inc:/etc/nginx/ambrosia/routes.inc:ro
      - ./deploy/nginx/cloudflare-ips.inc:/etc/nginx/ambrosia/cloudflare-ips.inc:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - ambrosia-network
      - ambrosia-external

volumes:
  dataprotection_keys:

networks:
  ambrosia-network:
    driver: bridge
  ambrosia-external:
    external: true
