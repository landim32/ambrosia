# Deploy de produção (https://ambrosioai.site) via SSH.
# Jobs sequenciais: checkout -> segredos -> rede -> build -> stop -> migrações -> deploy
# -> health check -> limpeza -> resumo.
# Só sobem migrator, api e mcp. O frontend (SPA compilado), o HTTPS e o proxy de /api, /auth, /mcp e
# /.well-known/oauth-* ficam no nginx compartilhado do repositório emagine-deploy (container
# emagine-app1), que alcança ambrosia-api e ambrosia-mcp pela rede externa emagine-network.
name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checkout:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
    - name: Clone or update repository
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"

          if [ -d "$DEPLOY_DIR/.git" ]; then
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git clean -fd -e .env.prod
          else
            echo "Cloning repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
          fi

          echo "Repository ready at $DEPLOY_DIR ($(git -C "$DEPLOY_DIR" rev-parse --short HEAD))"

  inject-secrets:
    runs-on: ubuntu-latest
    environment: PROD
    needs: checkout
    steps:
    - name: Inject secrets into .env.prod
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"

          cat > .env.prod <<'ENVEOF'
          AMBROSIO_CONNECTION_STRING=${{ secrets.AMBROSIO_CONNECTION_STRING }}
          AMBROSIO_JWT_SECRET=${{ secrets.AMBROSIO_JWT_SECRET }}
          AMBROSIO_GOOGLE_CLIENT_ID=${{ secrets.AMBROSIO_GOOGLE_CLIENT_ID }}
          AMBROSIO_CPF_PEPPER=${{ secrets.AMBROSIO_CPF_PEPPER }}
          AMBROSIO_CPF_ENCRYPTION_KEY=${{ secrets.AMBROSIO_CPF_ENCRYPTION_KEY }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          # Plugin do ChatGPT (feature 007, R13): chave RSA que assina os access tokens do
          # authorization server. Precisa ser um GitHub Secret em LINHA ÚNICA, com \n no lugar das
          # quebras reais do PEM — este heredoc escreve uma linha `KEY=valor`, e um valor multilinha
          # quebraria o .env.prod (as linhas seguintes virariam comandos/keys sem valor). É a única
          # variável nova do host que é segredo: os endereços canônicos (issuer e resource) são
          # fixos no docker-compose-prod.yml.
          AMBROSIO_AUTH_SIGNING_KEY_PEM=${{ secrets.AMBROSIO_AUTH_SIGNING_KEY_PEM }}
          ENVEOF

          sed -i 's/^[[:space:]]*//' .env.prod
          chmod 600 .env.prod
          echo ".env.prod written successfully"

          # Falha rápida: a API recusa startup com qualquer um destes vazia (a validação de
          # configuração da feature 004 passou a exigir também o par de chaves do Spaces, FR-020), mas
          # é melhor parar aqui do que derrubar o container depois do build. Não se faz `source` do
          # arquivo: senha de banco com espaço viraria "comando", e o conteúdo é segredo.
          for var in AMBROSIO_CONNECTION_STRING AMBROSIO_JWT_SECRET AMBROSIO_CPF_PEPPER AMBROSIO_CPF_ENCRYPTION_KEY S3_ACCESS_KEY S3_SECRET_KEY AMBROSIO_AUTH_SIGNING_KEY_PEM; do
            if ! grep -Eq "^${var}=.+" .env.prod; then
              echo "::error::O secret $var não está configurado (GitHub Secrets). O deploy parou antes do build."
              exit 1
            fi
          done
          echo "Todos os segredos obrigatórios estão presentes"

  network-setup:
    runs-on: ubuntu-latest
    environment: PROD
    needs: inject-secrets
    steps:
    - name: Ensure Docker network exists
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          # Rede compartilhada com o nginx do emagine-deploy (mesmo comando do pipeline dele).
          docker network inspect emagine-network >/dev/null 2>&1 || docker network create emagine-network
          echo "Network emagine-network ready"

  build:
    runs-on: ubuntu-latest
    environment: PROD
    needs: network-setup
    steps:
    - name: Build images
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        # O padrão da ssh-action é 10 min, e o build sem cache (bundle do EF + Chromium do Playwright)
        # passa disso no primeiro deploy.
        command_timeout: 60m
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml"

          $COMPOSE build --pull
          echo "Images built"

  stop-services:
    runs-on: ubuntu-latest
    environment: PROD
    needs: build
    steps:
    - name: Stop running containers
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml"

          # --remove-orphans também derruba ambrosia-frontend e ambrosia-gateway de deploys antigos,
          # que saíram do compose e liberam as portas 80/443 para o nginx do emagine-deploy.
          $COMPOSE down --remove-orphans || true
          echo "Services stopped"

  migrate:
    runs-on: ubuntu-latest
    environment: PROD
    needs: stop-services
    steps:
    - name: Apply database migrations
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml"

          $COMPOSE run --rm migrator
          echo "Migrations applied"

  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    needs: migrate
    steps:
    - name: Start services
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml"

          $COMPOSE up -d
          echo "Services started"

  health-check:
    runs-on: ubuntu-latest
    environment: PROD
    needs: deploy
    steps:
    - name: Verify deployment health
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml"

          # O teste fala direto com os containers pela emagine-network, com os mesmos cabeçalhos que o
          # nginx do emagine-deploy manda (Host ambrosioai.site, exigido pelo AllowedHosts de
          # produção, e X-Forwarded-*): assim ele valida este deploy sem depender do nginx
          # compartilhado, que é publicado pelo outro repositório.
          CURL="docker run --rm --network emagine-network curlimages/curl:8.10.1 -s -o /dev/null -w %{http_code} -H Host:ambrosioai.site -H X-Forwarded-Proto:https"
          echo "Waiting for services to start..."
          for i in $(seq 1 12); do
            HTTP_STATUS=$($CURL -H X-Forwarded-Prefix:/api http://ambrosia-api:8080/swagger/v1/swagger.json || echo "000")
            # Host do plugin (feature 007): a descoberta OAuth é anônima e é a primeira coisa que o
            # ChatGPT consulta — se ela não responder JSON 200, o plugin não conecta e o resto do
            # deploy está inútil mesmo com a API verde.
            MCP_STATUS=$($CURL http://ambrosia-mcp:8080/.well-known/oauth-protected-resource/mcp || echo "000")
            if [ "$HTTP_STATUS" = "200" ] && [ "$MCP_STATUS" = "200" ]; then
              echo "Health check passed (API HTTP $HTTP_STATUS, MCP HTTP $MCP_STATUS)"
              $COMPOSE ps
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed (API HTTP $HTTP_STATUS, MCP HTTP $MCP_STATUS)"
          $COMPOSE ps
          $COMPOSE logs --tail=80 api mcp
          exit 1

  cleanup:
    runs-on: ubuntu-latest
    environment: PROD
    needs: health-check
    steps:
    - name: Remove dangling images
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          docker image prune -f
          echo "Dangling images removed"

  summary:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
    - name: Deployment summary
      run: |
        echo "## ✅ Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| URL | https://ambrosioai.site |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Timestamp | \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
