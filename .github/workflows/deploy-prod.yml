# Deploy de produção (https://ambrosiaai.site) via SSH.
# Jobs sequenciais: checkout -> segredos -> certificado -> rede -> build -> stop -> migrações
# -> deploy -> health check -> limpeza -> resumo.
name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
    - name: Clone or update repository
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"

          if [ -d "$DEPLOY_DIR/.git" ]; then
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git clean -fd -e .env.prod -e deploy/nginx/certs/
          else
            echo "Cloning repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
          fi

          echo "Repository ready at $DEPLOY_DIR ($(git -C "$DEPLOY_DIR" rev-parse --short HEAD))"

  inject-secrets:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
    - name: Inject secrets into .env.prod
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"

          cat > .env.prod <<'ENVEOF'
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }}
          AUTH_GOOGLE_CLIENT_ID=${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          CPF_PEPPER=${{ secrets.CPF_PEPPER }}
          CPF_ENCRYPTION_KEY=${{ secrets.CPF_ENCRYPTION_KEY }}
          OBJECT_STORAGE_ACCESS_KEY=${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY=${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
          OBJECT_STORAGE_PUBLIC_ORIGIN=${{ secrets.OBJECT_STORAGE_PUBLIC_ORIGIN }}
          # Plugin do ChatGPT (feature 007, R13): chave RSA que assina os access tokens do
          # authorization server. Precisa ser um GitHub Secret em LINHA ÚNICA, com \n no lugar das
          # quebras reais do PEM — este heredoc escreve uma linha `KEY=valor`, e um valor multilinha
          # quebraria o .env.prod (as linhas seguintes virariam comandos/keys sem valor). É a única
          # variável nova do host que é segredo: AUTH_ISSUER e MCP_RESOURCE_URL são os endereços
          # canônicos e já vêm do appsettings.Production.json com default no compose.
          AUTH_SIGNING_KEY_PEM=${{ secrets.AUTH_SIGNING_KEY_PEM }}
          ENVEOF

          sed -i 's/^[[:space:]]*//' .env.prod
          chmod 600 .env.prod
          echo ".env.prod written successfully"

          # Falha rápida: a API recusa startup com qualquer um destes vazia (a validação de
          # configuração da feature 004 passou a exigir também o par de chaves do Spaces, FR-020), mas
          # é melhor parar aqui do que derrubar o container depois do build. Não se faz `source` do
          # arquivo: senha de banco com espaço viraria "comando", e o conteúdo é segredo.
          for var in DB_CONNECTION_STRING AUTH_JWT_SECRET CPF_PEPPER CPF_ENCRYPTION_KEY OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY OBJECT_STORAGE_PUBLIC_ORIGIN AUTH_SIGNING_KEY_PEM; do
            if ! grep -Eq "^${var}=.+" .env.prod; then
              echo "::error::O secret $var não está configurado (GitHub Secrets). O deploy parou antes do build."
              exit 1
            fi
          done
          echo "Todos os segredos obrigatórios estão presentes"

  inject-certificates:
    runs-on: ubuntu-latest
    needs: inject-secrets
    steps:
    - name: Write Cloudflare Origin Certificate
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          mkdir -p deploy/nginx/certs

          cat > deploy/nginx/certs/origin.pem <<'CERTEOF'
          ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CERTEOF
          cat > deploy/nginx/certs/origin.key <<'KEYEOF'
          ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          KEYEOF

          sed -i 's/^[[:space:]]*//' deploy/nginx/certs/origin.pem deploy/nginx/certs/origin.key
          chmod 644 deploy/nginx/certs/origin.pem
          chmod 600 deploy/nginx/certs/origin.key
          # nginx roda como root no master e lê a chave antes de trocar de usuário.
          openssl x509 -in deploy/nginx/certs/origin.pem -noout -subject -enddate

  network-setup:
    runs-on: ubuntu-latest
    needs: inject-certificates
    steps:
    - name: Ensure Docker network exists
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          docker network inspect ambrosia-external >/dev/null 2>&1 || docker network create ambrosia-external
          echo "Network ambrosia-external ready"

  build:
    runs-on: ubuntu-latest
    needs: network-setup
    steps:
    - name: Build images
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          PROFILE_ARGS=""
          if [ -f frontend/Dockerfile ]; then PROFILE_ARGS="--profile frontend"; fi
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml $PROFILE_ARGS"

          $COMPOSE build --pull
          echo "Images built"

  stop-services:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Stop running containers
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          PROFILE_ARGS=""
          if [ -f frontend/Dockerfile ]; then PROFILE_ARGS="--profile frontend"; fi
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml $PROFILE_ARGS"

          $COMPOSE down --remove-orphans || true
          echo "Services stopped"

  migrate:
    runs-on: ubuntu-latest
    needs: stop-services
    steps:
    - name: Apply database migrations
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          PROFILE_ARGS=""
          if [ -f frontend/Dockerfile ]; then PROFILE_ARGS="--profile frontend"; fi
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml $PROFILE_ARGS"

          $COMPOSE run --rm migrator
          echo "Migrations applied"

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
    - name: Start services
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          PROFILE_ARGS=""
          if [ -f frontend/Dockerfile ]; then PROFILE_ARGS="--profile frontend"; fi
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml $PROFILE_ARGS"

          $COMPOSE up -d
          echo "Services started"

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Verify deployment health
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          cd "$DEPLOY_DIR"
          PROFILE_ARGS=""
          if [ -f frontend/Dockerfile ]; then PROFILE_ARGS="--profile frontend"; fi
          COMPOSE="docker compose --env-file .env.prod -f docker-compose-prod.yml $PROFILE_ARGS"

          echo "Waiting for services to start..."
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}"               --resolve ambrosiaai.site:443:127.0.0.1               https://ambrosiaai.site/api/swagger/v1/swagger.json || echo "000")
            # Host do plugin (feature 007): a descoberta OAuth é anônima e é a primeira coisa que o
            # ChatGPT consulta — se ela não responder JSON 200, o plugin não conecta e o resto do
            # deploy está inútil mesmo com a API verde.
            MCP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}"               --resolve ambrosiaai.site:443:127.0.0.1               https://ambrosiaai.site/.well-known/oauth-protected-resource/mcp || echo "000")
            if [ "$HTTP_STATUS" = "200" ] && [ "$MCP_STATUS" = "200" ]; then
              echo "Health check passed (API HTTP $HTTP_STATUS, MCP HTTP $MCP_STATUS)"
              $COMPOSE ps
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed (API HTTP $HTTP_STATUS, MCP HTTP $MCP_STATUS)"
          $COMPOSE ps
          $COMPOSE logs --tail=80 api gateway mcp
          exit 1

  cleanup:
    runs-on: ubuntu-latest
    needs: health-check
    steps:
    - name: Remove dangling images
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        script: |
          set -e
          DEPLOY_DIR="/opt/ambrosia"
          docker image prune -f
          echo "Dangling images removed"

  summary:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
    - name: Deployment summary
      run: |
        echo "## ✅ Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| URL | https://ambrosiaai.site |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Timestamp | \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
